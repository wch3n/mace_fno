[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mace-fno"
version = "0.1.0"
description = "Differentiable particle-mesh prototypes for long-range MACE extensions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.23",
    "numpy>=1.24",
    "torch>=2.2",
]

[project.optional-dependencies]
mace = [
    "mace-torch>=0.3.16",
]
vasp = [
    "pymatgen>=2024.1",
]
dev = [
    "ruff>=0.9",
]

[project.scripts]
mace-fno-train = "mace_fno.cli.train_residual:main"

[tool.setuptools.packages.find]
where = ["src"]

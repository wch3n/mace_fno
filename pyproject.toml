[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mace-fno"
version = "0.1.0"
description = "Differentiable particle-mesh prototypes for long-range MACE extensions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Wei Chen", email = "waynechen@gmail.com"},
]
keywords = [
    "Fourier neural operator",
    "interatomic potential",
    "long-range interaction",
    "MACE",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.23",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
mace = [
    "mace-torch>=0.3.16",
]
dev = [
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/wch3n/mace_fno"
Issues = "https://github.com/wch3n/mace_fno/issues"
Repository = "https://github.com/wch3n/mace_fno.git"

[project.scripts]
mace-fno-train = "mace_fno.cli.train_residual:main"
mace-fno-evaluate-mace = "mace_fno.cli.evaluate_mace:main"
mace-fno-evaluate = "mace_fno.cli.evaluate_residual:main"
mace-fno-audit-2p5d = "mace_fno.cli.audit_2p5d:main"
mace-fno-audit-3d = "mace_fno.cli.audit_3d:main"
mace-fno-audit-spectral = "mace_fno.cli.audit_spectral:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Paths, seed, and checkpoint name are supplied by the Slurm wrapper.
data:
  energy_key: energy
  forces_key: forces
  num_atoms: 192

model:
  spatial_scheme: 3d
  cell_mode: fixed
  grid: 24
  z_grid: 24
  modes: 4
  z_modes: 4
  channels: 4
  source_hidden_channels: 64
  fno_hidden_channels: 16
  fno_layers: 2
  architecture: nonlinear
  spectral_symmetry: metric_eqgino
  spectral_groups: 1
  metric_hidden_channels: 16
  volume_interlacing: 2
  interlacing_training: random

training:
  steps: 8000
  learning_rate: 3.0e-4
  output_initialization_scale: 0.1
  lr_scheduler: plateau
  lr_decay_factor: 0.5
  lr_patience_evals: 4
  minimum_learning_rate: 1.0e-6
  early_stopping_patience_evals: 0
  energy_weight: 1.0
  force_weight: 1.0
  energy_scale: 2.912376050137488e-4
  force_scale: 2.6590301433249107e-2
  validation_fraction: 0.05
  eval_interval: 500
  batch_size: 8
  evaluation_batch_size: 8
  accumulation_steps: 1
  evaluation_scope: validation-test

# The pilot ranks configurations by held-out validation metrics. The more
# expensive response diagnostic is run only for the selected final model.
diagnostics:
  spectral_diagnostic_samples: 0

runtime:
  device: cuda

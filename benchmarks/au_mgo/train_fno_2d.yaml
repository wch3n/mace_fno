# Runtime paths, seed, dtype, and checkpoint are supplied by the Slurm wrapper.
data:
  energy_key: energy
  forces_key: forces
  allow_periodic_z: true

model:
  spatial_scheme: 2d
  cell_mode: fixed
  grid: 24
  modes: 4
  channels: 4
  source_hidden_channels: 64
  fno_hidden_channels: 16
  fno_layers: 2
  architecture: nonlinear

training:
  steps: 1500
  learning_rate: 3.0e-4
  lr_scheduler: none
  lr_decay_factor: 0.5
  lr_patience_evals: 4
  minimum_learning_rate: 1.0e-6
  early_stopping_patience_evals: 0
  energy_weight: 1.0
  force_weight: 1.0
  energy_scale: 0.002260
  force_scale: 0.056280
  validation_fraction: 0.05
  eval_interval: 250
  batch_size: 4
  evaluation_batch_size: 8
  accumulation_steps: 1
  evaluation_scope: validation-test

runtime:
  device: cuda
